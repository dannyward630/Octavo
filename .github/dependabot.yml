# Weekly dependency updates, minor and patch grouped into one pull request so CI checks them
# together; major versions (Electron, pdf.js, React...) arrive one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node's types follow the oldest Node Octavo supports (22, the README's minimum), so the type
      # checker flags APIs that Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
