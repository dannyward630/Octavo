# Tests and packages Octavo on Windows and Linux for every push to main and every pull request.
# Pushing a version tag (npm run release, then git push --follow-tags) also publishes the Windows
# installer and the Linux AppImage as a GitHub release, with that version's CHANGELOG.md entry as
# the notes.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: dist/*-setup.exe
          - name: Linux
            os: ubuntu-24.04
            target: --linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:fetch
      - run: npm run typecheck
      - run: npm test

      - name: Smoke test
        if: runner.os == 'Windows'
        run: npm run smoke
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run smoke
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - name: Keep the smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.name }}
          path: screenshots/

      # Regenerated for every build, so the notices shipped in the package always match the packages
      # it contains; npm run release commits the current copy with each version.
      - name: Third-party notices
        run: npm run licenses
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: The AppImage starts
        if: runner.os == 'Linux'
        run: |
          app=$(ls dist/*.AppImage)
          chmod +x "$app"
          # The desktop entry leaves the sandbox decision to the launcher (electron-builder.yml).
          "$app" --appimage-extract '*.desktop' > /dev/null
          grep '^Exec=' squashfs-root/*.desktop
          ! grep -q -- '--no-sandbox' squashfs-root/*.desktop
          try() {
            # Still running after 20 s (timeout's exit code 124) means it started.
            set +e
            timeout 20 xvfb-run -a "$app" --appimage-extract-and-run > run.log 2>&1
            code=$?
            set -e
            echo "$1: exit $code"; tail -5 run.log
            [ "$code" = 124 ]
          }
          try "as on a default Ubuntu 24.04 desktop" || echo "::warning::The AppImage does not start where unprivileged user namespaces are restricted"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          try "with user namespaces allowed"

      - uses: actions/upload-artifact@v7
        with:
          name: octavo-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Octavo $GITHUB_REF_NAME" --notes-file notes.md
